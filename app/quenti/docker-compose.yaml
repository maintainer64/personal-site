version: '3.8'

services:
  quenti_app:
    build:
      context: .
    container_name: quenti_app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://root:password@db:3306/quenti
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your_nextauth_secret_here
      - QUENTI_ENCRYPTION_KEY=your_encryption_key_here
      - GOOGLE_CLIENT_ID=your_google_client_id
      - GOOGLE_CLIENT_SECRET=your_google_client_secret

  quenti_db:
    image: docker.io/mysql:8.0
    container_name: quenti_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: quenti
      MYSQL_USER: quenti_user
      MYSQL_PASSWORD: quenti_pass
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: